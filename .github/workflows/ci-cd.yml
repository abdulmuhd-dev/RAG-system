name: RAG System CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  test:
    name: Tests + Coverage + Security
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-311 \
          --ignore-vuln CVE-2026-45830 \
          --ignore-vuln CVE-2026-45831 \
          --ignore-vuln CVE-2026-45833
          # ChromaDB 1.5.9 currently has vulnerabilities reported by
          # pip-audit for which no fixed upstream version is available.
          # These IDs are explicitly ignored until ChromaDB publishes fixes

      - name: Run Bandit security scan
        run: |
          bandit -r app -ll

      - name: Run tests with coverage
        env:
          HOST: ${{ vars.HOST }}
          PORT: ${{ vars.PORT }}
          DEBUG: ${{ vars.DEBUG }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${{ vars.COVERAGE_THRESHOLD }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7


  build-and-push:
    name: Build + Scan + Push
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - test

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    environment: production

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-rag-system
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHORT_SHA}"

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} \
            .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push versioned image
        run: |
          docker push \
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}

  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest

    needs: build-and-push

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag
        run: |
          SHORT_SHA="${{ needs.build-and-push.outputs.image-tag }}"
          NEW_IMAGE="${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${SHORT_SHA}"

          sed -i \
            "s|image:.*rag-system:.*|image: ${NEW_IMAGE}|g" \
            k8s/deployment.yml

          echo "Updated image:"
          echo "${NEW_IMAGE}"

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yml

          git diff --staged --quiet || git commit \
            -m "chore: update rag-api image to ${{ needs.build-and-push.outputs.image-tag }}"

      - name: Push manifest update
        run: |
          git push
