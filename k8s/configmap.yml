apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-system
data:
  MODEL_NAME: "openrouter/free"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "50"
  TOP_K_RESULTS: "4"
  CHROMA_PERSIST_DIR: "/app/chroma_db"
  COLLECTION_NAME: "rag_documents"
  HOST: "0.0.0.0"
  PORT: 8000
  DEBUG: False
