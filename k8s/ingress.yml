apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-api-ingress
  namespace: rag-system
  annotations:
    # internet-facing ALB (not internal)
    alb.ingress.kubernetes.io/scheme: internet-facing

    # shared ALB
    alb.ingress.kubernetes.io/group.name: platform

    # ALB target type
    alb.ingress.kubernetes.io/target-type: ip

    # health check path for ALB
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health

    # HTTPS — listen on both ports
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # redirect all HTTP → HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # ACM wildcard cert — paste ARN after dns_acm apply
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:617711905688:certificate/4b01fc23-8e8d-41e2-ac13-9fcef7df3837"

spec:
  ingressClassName: alb

  rules:
    - host: abdulmuhd.dpdns.org
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: rag-api-service
                port:
                  number: 80
