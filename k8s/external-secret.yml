# ExternalSecret defines WHAT to pull and WHERE to put it
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rag-external-secret
  namespace: rag-system
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  # the K8s secret ESO will create/update
  target:
    name: rag-secrets          # same name deployment.yml references
    creationPolicy: Owner      # ESO owns this secret

  # map AWS secret keys → K8s secret keys
  data:
    - secretKey: OPENROUTER_API_KEY     # key in K8s secret
      remoteRef:
        key: rag-system/openrouter-api-key  # AWS Secrets Manager path
        property: OPENROUTER_API_KEY        # JSON field name
