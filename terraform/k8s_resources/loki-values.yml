deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem

  limits_config:
    allow_structured_metadata: false
    reject_old_samples: true
    reject_old_samples_max_age: 168h

singleBinary:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 356Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: gp2
    size: 10Gi

chunksCache:
  enabled: true
  allocatedMemory: 256
  replicas: 1


read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

gateway:
  enabled: true
